[workspace]
resolver = "3"
members = ["crates/texlocal-core", "crates/texlocal-ffi", "crates/texlocal-latex", "crates/texlocal-wire"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.clippy]
missing_safety_doc = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.release.build-override]
strip = false
