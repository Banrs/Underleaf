[workspace]
resolver = "3"
members = ["crates/texlocal-core", "crates/texlocal-ffi"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

# Pedantic lints that find real slips here; the rest of pedantic is noise for this code
# (UTF-16 offsets cast by design, prose doc comments, an unpublished library).
[workspace.lints.clippy]
assigning_clones = "warn"
borrow_as_ptr = "warn"
derive_partial_eq_without_eq = "warn"
format_push_string = "warn"
ignored_unit_patterns = "warn"
map_unwrap_or = "warn"
needless_collect = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
stable_sort_primitive = "warn"
unchecked_time_subtraction = "warn"
unused_self = "warn"
use_self = "warn"

# LTO reaches both apps' texlocal-ffi: the Mac app's archive, and the DLL the
# Windows app builds with `cargo rustc --crate-type cdylib`. Measured in
# October 2026 through the C ABI, an LTO archive was no faster on the editor's
# calls, and left a stripped binary that linked it 1.5 MB smaller.
[profile.release]
codegen-units = 1
lto = true
strip = true

# Proc macros and build scripts only run on the build machine. Stripped by
# the macOS 27 toolchain for a deployment target, as Xcode hands cargo the
# app's 27.0, their dylibs fail to load ("mis-aligned LINKEDIT string pool"),
# which breaks the app's release build.
[profile.release.build-override]
strip = false
