<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- The editor page the native apps embed (see web/src/embed/editor.js).
       Everything is same-origin: the host serves web/ on its own scheme. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/dist/katex.min.css" />
  <style>
    html, body { height: 100%; margin: 0; background: var(--bg-content); }
    #editor { height: 100%; }
    /* The platform's own scrollers — overlay ones that follow System
       Settings on a Mac, Fluent ones on Windows — rather than the browser
       version's tinted bar (styles.css). */
    * { scrollbar-width: auto; scrollbar-color: auto; }
    /* Room to scroll the last line clear of the host's status bar. */
    .cm-content { padding-bottom: 64px; }
  </style>
</head>
<body>
  <div id="editor" class="editor-host"></div>
  <script type="module" src="/dist/embed-editor.js"></script>
</body>
</html>
