<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- The extra sources serve the desktop shell: Tauri's IPC endpoint, and the
       texlocal:// scheme carrying compiled PDFs and project images (spelled two
       ways because WebView2 maps custom schemes onto http://<scheme>.localhost).
       All of them are inert in browser mode, where the app is same-origin. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: texlocal: http://texlocal.localhost; worker-src 'self' blob:; connect-src 'self' ipc: http://ipc.localhost texlocal: http://texlocal.localhost" />
  <title>TeXLocal</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/pdf-find.css" />
  <link rel="stylesheet" href="/dist/katex.min.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>" />
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="/dist/bundle.js"></script>
</body>
</html>
