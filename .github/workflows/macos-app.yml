name: macOS app

# The Mac app in apps/macos, built with the committed Xcode project and tested. It runs on
# push as well as on pull requests, so a branch changing the app gets a build without a PR
# first; only paths the app builds from trigger it.
on:
  pull_request:
    paths: &paths
      - apps/macos/**
      - crates/**
      - web/**
      - package*.json
      - build.mjs
      - .github/workflows/macos-app.yml
  push:
    paths: *paths

permissions:
  contents: read

# A newer push to a pull request supersedes the older run. Pushes are grouped
# by commit instead, so parallel work on one branch never cancels another's run.
concurrency:
  group: macos-app-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # The app is built for macOS 27. GitHub's macOS 27 runner is the
    # xcode-27 image (in preview); there is no macos-27 label.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      # The app and its test host in a defaults domain of their own; the scheme gives the
      # tests a scratch project library.
      APP_ID: com.texlocal.mac.ci${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # The newest Xcode on the image, which is not always the default one.
      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          sw_vers
      # Keyed on the deployment target (project.yml): cargo does not rebuild
      # when it changes, and objects cached for a newer macOS than the app
      # links for draw a linker warning each.
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-app-27.0
      # The app copies JetBrains Mono and KaTeX from node_modules.
      - run: npm ci
      - name: Build
        working-directory: apps/macos
        run: >-
          xcodebuild -scheme TeXLocal -destination 'platform=macOS'
          TEXLOCAL_APP_IDENTIFIER="$APP_ID" build-for-testing
      # The core must be linked in, not loaded: a dylib from target/ would be
      # loaded from its build path, which exists only on the machine that
      # built the app.
      - name: Core linked statically
        working-directory: apps/macos
        run: |
          DIR=$(xcodebuild -scheme TeXLocal -showBuildSettings | awk '$1 == "BUILT_PRODUCTS_DIR" { print $3; exit }')
          otool -L "$DIR"/TeXLocal.app/Contents/MacOS/*
          if otool -L "$DIR"/TeXLocal.app/Contents/MacOS/* | grep -q texlocal_ffi; then
            echo "::error::The app loads the Rust core as a dylib"
            exit 1
          fi
      - name: Test
        working-directory: apps/macos
        run: >-
          xcodebuild -scheme TeXLocal -destination 'platform=macOS' -parallel-testing-enabled NO
          -resultBundlePath "$RUNNER_TEMP/TeXLocal-tests.xcresult" TEXLOCAL_APP_IDENTIFIER="$APP_ID" test-without-building
      # xcodebuild passes a run in which no test ran. Tests that need TeX skip themselves on
      # the runner, which has none.
      - name: Tests ran
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/TeXLocal-tests.xcresult" --compact > "$RUNNER_TEMP/summary.json"
          node --input-type=module - "$RUNNER_TEMP/summary.json" <<'JS'
          import { readFileSync } from 'node:fs';
          const { totalTestCount, passedTests, failedTests, skippedTests } = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          console.log(`${totalTestCount} tests: ${passedTests} passed, ${failedTests} failed, ${skippedTests} skipped`);
          if (!(passedTests > 0) || failedTests !== 0) throw new Error('No test passed, or one failed');
          JS
      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-results
          path: ${{ runner.temp }}/TeXLocal-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
