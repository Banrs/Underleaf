name: macOS app

# The SwiftUI app in apps/macos, built with the committed Xcode project. It
# runs on push as well as on pull requests so a branch changing the app gets a
# compile without opening a PR first; only paths the app builds from trigger it.
on:
  pull_request:
    paths: &paths
      - apps/macos/**
      - crates/**
      - web/**
      - package*.json
      - build.mjs
      - .github/workflows/macos-app.yml
  push:
    paths: *paths

# A newer push to a pull request supersedes the older run. Pushes are grouped
# by commit instead, so parallel work on one branch never cancels another's run.
concurrency:
  group: macos-app-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: macos-app
      - run: npm ci
      # The app targets macOS 27, so it needs the newest Xcode on the image,
      # which is not always the default one.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos
          sw_vers
      # The project targets macOS 27. While the runner image is older, build
      # and test for the older of the host and the SDK instead: an SDK that
      # predates 27 fails the build on any API that needs 27 either way.
      - name: Deployment target for this runner
        run: |
          HOST=$(sw_vers -productVersion | cut -d. -f1-2)
          SDK=$(xcrun --sdk macosx --show-sdk-version)
          TARGET=$(printf '%s\n' "$HOST" "$SDK" | sort -V | head -1)
          if [ "${TARGET%%.*}" -lt 27 ]; then
            echo "::warning::Runner has macOS $HOST and SDK $SDK; building for $TARGET instead of 27.0"
            echo "TARGET_OVERRIDE=MACOSX_DEPLOYMENT_TARGET=$TARGET" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: apps/macos
        run: xcodebuild -scheme TeXLocal -destination 'platform=macOS' $TARGET_OVERRIDE build-for-testing
      - name: Test
        working-directory: apps/macos
        run: xcodebuild -scheme TeXLocal -destination 'platform=macOS' $TARGET_OVERRIDE test-without-building
