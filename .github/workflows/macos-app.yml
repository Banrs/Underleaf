name: macOS app

# The SwiftUI app in apps/macos, built with the committed Xcode project. It
# runs on push as well as on pull requests so a branch changing the app gets a
# compile without opening a PR first; only paths the app builds from trigger it.
on:
  pull_request:
    paths: &paths
      - apps/macos/**
      - crates/**
      - web/**
      - package*.json
      - build.mjs
      - .github/workflows/macos-app.yml
  push:
    paths: *paths

# A newer push to a pull request supersedes the older run. Pushes are grouped
# by commit instead, so parallel work on one branch never cancels another's run.
concurrency:
  group: macos-app-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # The newest Xcode on the image, which is not always the default one.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos
          sw_vers
      # Keyed on the deployment target (project.yml): cargo does not rebuild
      # when it changes, and objects cached for a newer macOS than the app
      # links for draw a linker warning each.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: macos-app-26.0
      - run: npm ci
      - name: Build
        working-directory: apps/macos
        run: xcodebuild -scheme TeXLocal -destination 'platform=macOS' build-for-testing
      # The core must be linked in, not loaded: a dylib from target/ would be
      # loaded from its build path, which exists only on the machine that
      # built the app.
      - name: Core linked statically
        working-directory: apps/macos
        run: |
          DIR=$(xcodebuild -scheme TeXLocal -showBuildSettings | awk '$1 == "BUILT_PRODUCTS_DIR" { print $3; exit }')
          otool -L "$DIR"/TeXLocal.app/Contents/MacOS/*
          if otool -L "$DIR"/TeXLocal.app/Contents/MacOS/* | grep -q texlocal_ffi; then
            echo "::error::The app loads the Rust core as a dylib"
            exit 1
          fi
      - name: Test
        working-directory: apps/macos
        run: xcodebuild -scheme TeXLocal -destination 'platform=macOS' test-without-building
