name: Format review fixes

on:
  push:
    paths:
      - '.github/workflows/format-review-fixes.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply rustfmt to review fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
