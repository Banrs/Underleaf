name: CI

# One workflow: the Rust core on Linux and Windows, and the Mac app, each only
# when a path it builds from changed. `ci-ok` is the one check to require.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      mac: ${{ steps.paths.outputs.mac }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Everything runs when there is no usable base (manual runs, new branches).
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
          else
            files=ALL
          fi
          has() { [ "$files" = ALL ] || grep -Eq "$1" <<< "$files"; }
          shared='^(crates/texlocal-(core|ffi|syntax)/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)'
          has "$shared|^crates/" && echo rust=true >> "$GITHUB_OUTPUT"
          has "$shared|^apps/macos/" && echo mac=true >> "$GITHUB_OUTPUT"
          exit 0

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  mac:
    name: Mac app
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    # macOS 27 is GitHub's xcode-27 image (in preview); there is no macos-27 label.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # The app and its test host get a defaults domain of their own.
      APP_ID: com.texlocal.mac.ci${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      # Keyed on the deployment target: cargo doesn't rebuild when it changes.
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-app-27.0
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and test
        working-directory: apps/macos
        run: >-
          xcodebuild test -scheme TeXLocal -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/dd" -parallel-testing-enabled NO
          -resultBundlePath "$RUNNER_TEMP/TeXLocal.xcresult"
          TEXLOCAL_APP_IDENTIFIER="$APP_ID"
      # A dylib would load from target/, which exists only where it was built.
      - name: Core linked statically, tests ran
        run: |
          if otool -L "$RUNNER_TEMP"/dd/Build/Products/Debug/TeXLocal.app/Contents/MacOS/TeXLocal | grep -q texlocal_ffi; then
            echo "::error::The app loads the Rust core as a dylib"; exit 1
          fi
          # xcodebuild passes a run in which no test ran.
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/TeXLocal.xcresult" --compact \
            | jq -e '. as $r | "\(.totalTestCount) tests: \(.passedTests) passed, \(.skippedTests) skipped" | debug | $r.passedTests > 0'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mac-test-results
          path: ${{ runner.temp }}/TeXLocal.xcresult
          if-no-files-found: ignore
          retention-days: 7

  ci-ok:
    needs: [changes, rust, mac]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
