name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      mac: ${{ steps.paths.outputs.mac }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
          else
            files=ALL
          fi
          has() { [ "$files" = ALL ] || grep -Eq "$1" <<< "$files"; }
          shared='^(crates/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)'
          wire='^apps/macos/(TeXLocal/Wire|TeXLocalTests/WireFixtures)\.swift$'
          has "$shared|$wire" && echo rust=true >> "$GITHUB_OUTPUT"
          has "$shared|^apps/macos/|^tools/build-core\.sh$" && echo mac=true >> "$GITHUB_OUTPUT"
          exit 0

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check -p texlocal-latex --target wasm32-unknown-unknown
      - run: cargo check -p texlocal-core --target aarch64-apple-ios

  mac:
    name: Mac app
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      APP_ID: com.texlocal.mac.ci${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: macos-app-27.0
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and test
        working-directory: apps/macos
        run: >-
          xcodebuild test -scheme TeXLocal -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/dd" -parallel-testing-enabled NO
          -resultBundlePath "$RUNNER_TEMP/TeXLocal.xcresult"
          TEXLOCAL_APP_IDENTIFIER="$APP_ID"
      - name: Core linked statically, tests ran
        run: |
          if otool -L "$RUNNER_TEMP"/dd/Build/Products/Debug/TeXLocal.app/Contents/MacOS/TeXLocal | grep -q texlocal_ffi; then
            echo "::error::The app loads the Rust core as a dylib"; exit 1
          fi
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/TeXLocal.xcresult" --compact \
            | jq -e '. as $r | "\(.totalTestCount) tests: \(.passedTests) passed, \(.skippedTests) skipped" | debug | $r.passedTests > 0'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mac-test-results
          path: ${{ runner.temp }}/TeXLocal.xcresult
          if-no-files-found: ignore
          retention-days: 7

  ci-ok:
    needs: [changes, rust, mac]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"
