name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web tests and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      # texlocal-core carries no GUI dependencies on purpose, so the logic the
      # app is built on is checked here without installing a webview stack.
      - run: cargo fmt --all --check
      - run: cargo clippy -p texlocal-core --all-targets -- -D warnings
      - run: cargo test -p texlocal-core

  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}
      - run: npm ci
      # The core's path handling has real Windows branches (separators, drive
      # letters, MiKTeX discovery), so its tests run here as well as on Linux.
      # Built for the host, not the matrix target: a cross-compiled test binary
      # would need Rosetta to run on the Apple Silicon runner.
      - run: cargo test -p texlocal-core
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
      # The installers a reviewer can download and smoke-test; unsigned, so
      # macOS needs right-click → Open and Windows a SmartScreen override.
      - uses: actions/upload-artifact@v4
        with:
          name: TeXLocal-${{ matrix.target }}
          # One glob per platform's installer; each job matches exactly the
          # ones its own OS produces, so the others simply find nothing.
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
