name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      mac: ${{ steps.paths.outputs.mac }}
      release: ${{ steps.paths.outputs.release }}
      deps: ${{ steps.paths.outputs.deps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
          else
            files=ALL
          fi
          has() { [ "$files" = ALL ] || grep -Eq "$1" <<< "$files"; }
          shared='^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'
          wire='^apps/macos/(TeXLocal/Models/Wire|TeXLocalTests/WireFixtures)\.swift$'
          version='^apps/macos/(Version\.xcconfig|TeXLocal\.xcodeproj/project\.pbxproj)$'
          mac="$shared|^apps/macos/|^tools/(build-core|typecheck)\.sh$"
          build='(^|/)Cargo\.(toml|lock)$|^(rust-toolchain\.toml|tools/build-core\.sh|apps/macos/(Version\.xcconfig|TeXLocal\.xcodeproj/.*)|\.github/workflows/ci\.yml)$'
          has "$shared|$wire|$version" && echo rust=true >> "$GITHUB_OUTPUT"
          has "$mac" && echo mac=true >> "$GITHUB_OUTPUT"
          { has "$build" || { [ "$EVENT" != pull_request ] && has "$mac"; }; } && echo release=true >> "$GITHUB_OUTPUT"
          has '(^|/)Cargo\.(toml|lock)$|^(deny|rust-toolchain)\.toml$|^\.github/workflows/ci\.yml$' && echo deps=true >> "$GITHUB_OUTPUT"
          exit 0

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037
        with:
          tool: cargo-shear@1.14.0
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo shear
      - name: Consolidation Clippy diagnostics
        if: always()
        run: >-
          cargo clippy --locked --workspace --all-targets --message-format short --
          -W clippy::single_call_fn -W clippy::too_many_lines
          -W clippy::needless_pass_by_value -W clippy::match_same_arms
          -W clippy::redundant_else -W clippy::unnecessary_wraps
      - name: Consolidation duplication comparison
        if: always()
        env:
          BASE: f20ec736cb1917eb800c69a3ddcf68ef7cfcec29
        run: |
          git fetch --no-tags origin "$BASE"
          git worktree add --detach "$RUNNER_TEMP/consolidation-base" "$BASE"
          npx --yes jscpd@4.3.0 --min-tokens 50 --reporters console,json --format swift,rust --output "$RUNNER_TEMP/clones-current" apps/macos/TeXLocal crates
          cd "$RUNNER_TEMP/consolidation-base"
          npx --yes jscpd@4.3.0 --min-tokens 50 --reporters console,json --format swift,rust --output "$RUNNER_TEMP/clones-base" apps/macos/TeXLocal crates

  deps:
    name: Dependencies
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  mac:
    name: Mac app
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      APP_ID: com.texlocal.mac.ci${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - run: zsh tools/typecheck.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: macos-app-27.0
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and test
        working-directory: apps/macos
        run: >-
          xcodebuild test -scheme TeXLocal -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/dd" -parallel-testing-enabled NO
          -resultBundlePath "$RUNNER_TEMP/TeXLocal.xcresult"
          TEXLOCAL_APP_IDENTIFIER="$APP_ID"
      - name: Tests ran
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/TeXLocal.xcresult" --compact \
            | jq -e '. as $r | "\(.totalTestCount) tests: \(.passedTests) passed, \(.skippedTests) skipped" | debug | $r.passedTests > 0'
      - name: Consolidation dead-code diagnostics
        if: always()
        run: |
          curl --fail --location --silent --show-error https://github.com/peripheryapp/periphery/releases/download/3.8.0/periphery-3.8.0.zip --output "$RUNNER_TEMP/periphery.zip"
          printf '%s  %s\n' 07d4e286e31dd79164df39097e0b59f533c94badbe18158464a455ea88a166d7 "$RUNNER_TEMP/periphery.zip" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/periphery"
          unzip -q "$RUNNER_TEMP/periphery.zip" -d "$RUNNER_TEMP/periphery"
          "$RUNNER_TEMP/periphery/periphery" scan --project apps/macos/TeXLocal.xcodeproj --schemes TeXLocal --relative-results --quiet --report-exclude '**/Models/Wire.swift' --skip-build --index-store-path "$RUNNER_TEMP/dd/Index.noindex/DataStore"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mac-test-results
          path: ${{ runner.temp }}/TeXLocal.xcresult
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Release build
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: macos-release-27.0
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        working-directory: apps/macos
        run: >-
          xcodebuild build -scheme TeXLocal -configuration Release -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO

  ci-ok:
    needs: [changes, rust, deps, mac, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"
