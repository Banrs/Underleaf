name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web tests and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/check-version.mjs

  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # These crates carry no GUI dependencies on purpose, so they are checked
      # here without installing a webview stack.
      - run: cargo fmt --all --check
      - run: cargo clippy -p texlocal-core -p texlocal-syntax -p texlocal-ffi -p texlocal-server --all-targets -- -D warnings
      - run: cargo test -p texlocal-core -p texlocal-syntax -p texlocal-ffi -p texlocal-server
