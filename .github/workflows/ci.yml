name: CI

# One workflow: the Rust core on macOS and Windows, the Mac, iPad and
# Windows apps, each only when a path it builds from changed. `ci-ok` is the one check to require.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      mac: ${{ steps.paths.outputs.mac }}
      ipad: ${{ steps.paths.outputs.ipad }}
      windows: ${{ steps.paths.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Everything runs when there is no usable base (manual runs, new branches).
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
          else
            files=ALL
          fi
          has() { [ "$files" = ALL ] || grep -Eq "$1" <<< "$files"; }
          shared='^(crates/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)'
          has "$shared" && echo rust=true >> "$GITHUB_OUTPUT"
          apple='^(apps/shared/|tools/build-core\.sh$)'
          has "$shared|$apple|^apps/macos/" && echo mac=true >> "$GITHUB_OUTPUT"
          has "$shared|$apple|^apps/ipados/" && echo ipad=true >> "$GITHUB_OUTPUT"
          has "$shared|^apps/windows/" && echo windows=true >> "$GITHUB_OUTPUT"
          exit 0

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'macOS'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  mac:
    name: Mac app
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    # macOS 27 is GitHub's xcode-27 image (in preview); there is no macos-27 label.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # The app and its test host get a defaults domain of their own.
      APP_ID: com.texlocal.mac.ci${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      # Keyed on the deployment target: cargo doesn't rebuild when it changes.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-app-27.0
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and test
        working-directory: apps/macos
        run: >-
          xcodebuild test -scheme TeXLocal -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/dd" -parallel-testing-enabled NO
          -resultBundlePath "$RUNNER_TEMP/TeXLocal.xcresult"
          TEXLOCAL_APP_IDENTIFIER="$APP_ID"
      # A dylib would load from target/, which exists only where it was built.
      - name: Core linked statically, tests ran
        run: |
          if otool -L "$RUNNER_TEMP"/dd/Build/Products/Debug/TeXLocal.app/Contents/MacOS/TeXLocal | grep -q texlocal_ffi; then
            echo "::error::The app loads the Rust core as a dylib"; exit 1
          fi
          # xcodebuild passes a run in which no test ran.
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/TeXLocal.xcresult" --compact \
            | jq -e '. as $r | "\(.totalTestCount) tests: \(.passedTests) passed, \(.skippedTests) skipped" | debug | $r.passedTests > 0'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mac-test-results
          path: ${{ runner.temp }}/TeXLocal.xcresult
          if-no-files-found: ignore
          retention-days: 7

  ipad:
    name: iPad app
    needs: changes
    if: needs.changes.outputs.ipad == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ipad-app-27.0
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        working-directory: apps/ipados
        run: >-
          xcodebuild build -scheme TeXLocal -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/dd"

  windows:
    name: Windows app
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('apps/windows/**/*.csproj', 'apps/windows/Directory.Build.props') }}
      - name: No WebView2, no raw icon glyphs
        shell: bash
        run: |
          # An if, since bash -e ignores a failing `! grep` before the last line.
          if grep -rIlE 'WebView2|CoreWebView' apps/windows --exclude-dir=obj --exclude-dir=bin --include='*.cs' --include='*.xaml' --include='*.csproj' --include='*.props'; then exit 1; fi
          if LC_ALL=C.UTF-8 grep -rIlP '[\x{E000}-\x{F8FF}]' apps/windows --include='*.cs' --include='*.xaml'; then exit 1; fi
      - run: cargo rustc -p texlocal-ffi --lib --release --crate-type cdylib
      - run: dotnet build apps/windows/TeXLocal/TeXLocal.csproj -c Debug -p:Platform=x64 -p:SkipCargo=true
      - run: dotnet test apps/windows/TeXLocal.Tests -c Debug -p:SkipCargo=true
      - name: Smoke
        shell: pwsh
        env:
          TEXLOCAL_DATA: ${{ runner.temp }}\tl-smoke
        run: |
          $exe = Get-ChildItem apps/windows/TeXLocal/bin -Recurse -Filter TeXLocal.exe | Select-Object -First 1
          if (-not (Test-Path (Join-Path $exe.DirectoryName 'texlocal_ffi.dll'))) { throw 'texlocal_ffi.dll missing' }
          $err = Join-Path $env:RUNNER_TEMP smoke.err
          $p = Start-Process $exe.FullName -ArgumentList '--smoke' -PassThru -RedirectStandardError $err
          $null = $p.Handle  # else ExitCode can read null once it has exited
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'smoke timed out' }
          if ($p.ExitCode -ne 0) { Get-Content $err; throw "smoke exited $($p.ExitCode)" }

  ci-ok:
    needs: [changes, rust, mac, ipad, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"
