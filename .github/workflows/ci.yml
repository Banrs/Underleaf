name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      mac: ${{ steps.paths.outputs.mac }}
      release: ${{ steps.paths.outputs.release }}
      deps: ${{ steps.paths.outputs.deps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
          else
            files=ALL
          fi
          has() { [ "$files" = ALL ] || grep -Eq "$1" <<< "$files"; }
          shared='^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'
          wire='^apps/macos/(TeXLocal/Models/Wire|TeXLocalTests/WireFixtures)\.swift$'
          version='^apps/macos/(Version\.xcconfig|TeXLocal\.xcodeproj/project\.pbxproj)$'
          mac="$shared|^apps/macos/|^tools/(build-core|typecheck)\.sh$"
          build='(^|/)Cargo\.(toml|lock)$|^(rust-toolchain\.toml|tools/build-core\.sh|apps/macos/(Version\.xcconfig|TeXLocal\.xcodeproj/.*)|\.github/workflows/ci\.yml)$'
          has "$shared|$wire|$version" && echo rust=true >> "$GITHUB_OUTPUT"
          has "$mac" && echo mac=true >> "$GITHUB_OUTPUT"
          { has "$build" || { [ "$EVENT" != pull_request ] && has "$mac"; }; } && echo release=true >> "$GITHUB_OUTPUT"
          has '(^|/)Cargo\.(toml|lock)$|^(deny|rust-toolchain)\.toml$|^\.github/workflows/ci\.yml$' && echo deps=true >> "$GITHUB_OUTPUT"
          exit 0

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  deps:
    name: Dependencies
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037
        with:
          tool: cargo-deny@0.20.2,cargo-shear@1.14.0
      - run: cargo deny --locked check
      - run: cargo shear

  mac:
    name: Mac app
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      APP_ID: com.texlocal.mac.ci${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - run: zsh tools/typecheck.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: macos-app-27.0
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and test
        working-directory: apps/macos
        run: >-
          xcodebuild test -scheme TeXLocal -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/dd" -parallel-testing-enabled NO
          -resultBundlePath "$RUNNER_TEMP/TeXLocal.xcresult"
          TEXLOCAL_APP_IDENTIFIER="$APP_ID"
      - name: Tests ran
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/TeXLocal.xcresult" --compact \
            | jq -e '. as $r | "\(.totalTestCount) tests: \(.passedTests) passed, \(.skippedTests) skipped" | debug | $r.passedTests > 0'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mac-test-results
          path: ${{ runner.temp }}/TeXLocal.xcresult
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Release build
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: macos-release-27.0
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        working-directory: apps/macos
        run: >-
          xcodebuild build -scheme TeXLocal -configuration Release -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO

  ci-ok:
    needs: [changes, rust, deps, mac, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"
