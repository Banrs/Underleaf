name: Windows check

# Builds and tests the Windows app with ci.yml's steps (.github/actions/windows-app), then captures its screens and
# UI Automation trees (.github/win-check) for comparing two commits: push each to its own claude/win-check/<name>
# branch and diff the artifacts with tools/qa/shotdiff.py.
on:
  push:
    branches: ['claude/win-check/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      OUT: ${{ github.workspace }}\win-check-out
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/windows-app
      - name: Build the capture tool
        run: dotnet build .github/win-check/Capture.csproj -c Release -o "$env:RUNNER_TEMP\capture"
      # A pinned TinyTeX, outside the folders the core searches: only the launches given its PATH find TeX.
      - name: TinyTeX
        id: tex
        continue-on-error: true
        run: |
          $sfx = Join-Path $env:RUNNER_TEMP tinytex.exe
          Invoke-WebRequest https://github.com/rstudio/tinytex-releases/releases/download/v2026.10/TinyTeX-1-windows-v2026.10.exe -OutFile $sfx
          & 7z x $sfx "-o$env:RUNNER_TEMP\tinytex" -y | Out-Null
          $bin = Get-ChildItem "$env:RUNNER_TEMP\tinytex" -Recurse -Filter latexmk.exe | Select-Object -First 1
          if (-not $bin) { throw 'no latexmk in TinyTeX' }
          "TEX_BIN=$($bin.DirectoryName)" >> $env:GITHUB_ENV
      - name: Captures
        run: |
          $exe = Get-ChildItem apps/windows/TeXLocal/bin -Recurse -Filter TeXLocal.exe | Select-Object -First 1
          & "$env:RUNNER_TEMP\capture\Capture.exe" --exe $exe.FullName --seed tools/qa/library-seed --out $env:OUT --tex "$env:TEX_BIN"
          if ($LASTEXITCODE -ne 0) { throw "capture exited $LASTEXITCODE" }
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: win-check
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 14
