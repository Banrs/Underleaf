name: TeX check

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/texlocal-core/**'
      - 'crates/texlocal-latex/**'
      - 'tools/texpresso/**'
      - '.github/workflows/tex-check.yml'

permissions:
  contents: read

concurrency:
  group: tex-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      TINYTEX: v2026.10
      TEX_PACKAGES: glossaries nomencl makeindex koma-script synctex
      TEXPRESSO: ${{ github.workspace }}/.texpresso
    steps:
      - uses: actions/checkout@v7
      - name: TeXpresso's dependencies
        id: brew
        run: |
          brew install pkgconf mupdf icu4c harfbuzz graphite2
          echo "versions=$(brew list --versions mupdf icu4c harfbuzz graphite2 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: tex
        with:
          path: ~/TinyTeX
          key: tinytex-${{ env.TINYTEX }}-${{ env.TEX_PACKAGES }}
      - if: steps.tex.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/rstudio/tinytex-releases/releases/download/$TINYTEX/TinyTeX-1-darwin-$TINYTEX.tar.xz" | tar -xf - -C ~
          ~/TinyTeX/bin/universal-darwin/tlmgr update --self
          ~/TinyTeX/bin/universal-darwin/tlmgr install $TEX_PACKAGES
      - run: echo ~/TinyTeX/bin/universal-darwin >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        id: texpresso
        with:
          path: ${{ env.TEXPRESSO }}
          key: texpresso-${{ steps.brew.outputs.versions }}-${{ env.TINYTEX }}-${{ hashFiles('tools/texpresso/**') }}
      - if: steps.texpresso.outputs.cache-hit != 'true'
        run: |
          tools/texpresso/build.sh "$RUNNER_TEMP/texpresso-source"
          zsh tools/texpresso/bundle.sh "$RUNNER_TEMP/texpresso-source/build" "$TEXPRESSO"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: tex-check
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo test --locked --no-fail-fast -p texlocal-core -- --ignored --nocapture
        env:
          TEXLOCAL_TEXPRESSO: ${{ env.TEXPRESSO }}/Helpers/texpresso

  advisories:
    name: Advisories
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories

  # Whether underleaf-pdf.patch still applies to TeXpresso's latest commit. A pass
  # means the patch text applies, not that the patched TeXpresso builds or works;
  # the replacement files in tools/texpresso/src are copied, not patched, so they
  # aren't checked here.
  texpresso-drift:
    name: TeXpresso drift
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: git clone --quiet https://github.com/let-def/texpresso "$RUNNER_TEMP/texpresso"
      - name: Upstream commits since the pinned one
        run: |
          commit=$(sed -n 's/^COMMIT=//p' tools/texpresso/build.sh)
          cd "$RUNNER_TEMP/texpresso"
          git cat-file -e "$commit^{commit}" 2>/dev/null || git fetch --quiet origin "$commit"
          echo "$(git rev-list --count "$commit..HEAD") upstream commits since $commit"
          git log --oneline "$commit..HEAD"
      - name: Patch applies to upstream HEAD
        run: git -C "$RUNNER_TEMP/texpresso" apply --check "$GITHUB_WORKSPACE/tools/texpresso/underleaf-pdf.patch"
