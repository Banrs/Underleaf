[package]
name = "texlocal-server"
description = "TeXLocal in a browser — a loopback-only HTTP host over texlocal-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
getrandom = "0.3"
httparse = "1"
percent-encoding = "2"
serde_json = "1"
tempfile = "3"
texlocal-core = { path = "../texlocal-core" }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
