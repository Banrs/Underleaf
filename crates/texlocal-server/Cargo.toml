[package]
name = "texlocal-server"
description = "TeXLocal in a browser — a loopback-only HTTP host over texlocal-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
percent-encoding = "2"
serde_json = "1"
tempfile = "3"
texlocal-core = { path = "../texlocal-core" }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-io-timeout = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
