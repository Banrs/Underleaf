[package]
name = "texlocal-bindgen"
description = "UniFFI's binding generator, for apps/macos/scripts/generate-bindings.sh"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { version = "0.31", features = ["cli"] }
