[package]
name = "texlocal-wire"
description = "Writes each client's side of texlocal-core's protocol from its Rust types, with the fixtures every client's tests check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
schemars = { version = "1.2", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
texlocal-core = { path = "../texlocal-core" }

[lints]
workspace = true
