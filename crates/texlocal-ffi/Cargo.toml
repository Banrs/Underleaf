[package]
name = "texlocal-ffi"
description = "C ABI over texlocal-core's commands and sessions and texlocal-latex's editor, for the Mac app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "texlocal_ffi"
crate-type = ["staticlib"]

[dependencies]
serde_json = "1"
texlocal-core = { path = "../texlocal-core" }
texlocal-latex = { path = "../texlocal-latex" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
