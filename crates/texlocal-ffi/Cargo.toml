[package]
name = "texlocal-ffi"
description = "C ABI over texlocal-core's commands, sessions and editor logic, for the Mac and Windows apps"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "texlocal_ffi"
# staticlib links into the macOS app. The Windows app loads a DLL (P/Invoke)
# that its build asks for itself, with `cargo rustc --crate-type cdylib`, so
# the Mac's builds link no dylib they never use.
crate-type = ["staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
texlocal-core = { path = "../texlocal-core" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
