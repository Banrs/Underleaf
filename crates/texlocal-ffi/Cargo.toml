[package]
name = "texlocal-ffi"
description = "C ABI over texlocal-core's command service and texlocal-syntax's editor logic, for the macOS app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "texlocal_ffi"
# staticlib links into the macOS app; rlib is for tests/ffi.rs.
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
texlocal-core = { path = "../texlocal-core" }
texlocal-syntax = { path = "../texlocal-syntax" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
