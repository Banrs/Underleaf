[package]
name = "texlocal-latex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
regex = "1.12.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ratex-font-loader = "=0.1.15"
ratex-layout = "=0.1.14"
ratex-lexer = "=0.1.15"
ratex-parser = "=0.1.15"
ratex-svg = { version = "=0.1.15", features = ["embed-fonts"] }
ratex-types = "=0.1.15"
# ratex-katex-fonts embeds its fonts only in release builds unless rust-embed has debug-embed on.
rust-embed = { version = "8.11", features = ["debug-embed"] }
schemars = "1.2"

[lints]
workspace = true

[package.metadata.cargo-shear]
ignored = ["rust-embed"]
