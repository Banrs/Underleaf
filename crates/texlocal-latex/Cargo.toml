[package]
name = "texlocal-latex"
description = "TeXLocal's LaTeX logic: the editor, outline, checks and the log and SyncTeX parsers — no files, processes, threads or clock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
regex = "1.12.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ratex-layout = "=0.1.14"
ratex-lexer = "=0.1.14"
ratex-parser = "=0.1.14"
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"] }
ratex-types = "=0.1.14"
rust-embed = { version = "8.11", features = ["debug-embed"] }
schemars = "1.2"

[lints]
workspace = true

[package.metadata.cargo-shear]
ignored = ["rust-embed"]
