[package]
name = "texlocal-core"
description = "TeXLocal's core: projects, sessions, compiling, SyncTeX and the live preview over texlocal-latex — no GUI dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
notify = "8"
regex = "1.12.1"
schemars = { version = "1.2", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
texlocal-latex = { path = "../texlocal-latex" }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
