[package]
name = "texlocal-core"
description = "TeXLocal's core: projects, compiling, SyncTeX, the live preview and the editors' LaTeX logic — no GUI dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
memchr = "2"
notify = "8"
ropey = "1.6"
trash = "5"
which = "8"
regex = "1.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Checks TinyTeX's download against the sum GitHub gives it.
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
# zip's `deflate` feature also brings zopfli, used only past level 9, and the
# export writes level 6. Without it flate2 has no backend: this line chooses
# one, for zip and for reading TeX's compressed SyncTeX (synctex/parser.rs).
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The editors' maths as SVG (syntax/render.rs).
ratex-font = "=0.1.14"
ratex-katex-fonts = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-lexer = "=0.1.14"
ratex-parser = "=0.1.14"
# Glyphs as outlines from the KaTeX fonts compiled in; text those fonts
# haven't (CJK, Cyrillic) comes from its system-font fallback (render.rs).
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"] }
ratex-types = "=0.1.14"
# ratex-katex-fonts embeds its fonts only in release builds unless this is
# on: debug and test builds would read them from the registry at run time.
rust-embed = { version = "8.11", features = ["debug-embed"] }
ttf-parser = "0.25"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[lints]
workspace = true
