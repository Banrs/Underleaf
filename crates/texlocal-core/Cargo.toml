[package]
name = "texlocal-core"
description = "TeXLocal's core: projects, compiling, SyncTeX, the live preview and the editors' LaTeX logic — no GUI dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dunce = "1"
memchr = "2"
notify = "8"
ropey = "1.6"
which = "8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1.12.1"
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
# zip's `deflate` feature also brings zopfli, used only past level 9, and the
# export writes level 6. Without it flate2 has no backend, so flate2 is named
# here, used by no code, only to choose one: without its line it fails to build.
zip = { version = "2", default-features = false, features = ["chrono", "deflate-flate2", "flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The editors' maths as SVG (syntax/render.rs).
ratex-font = "=0.1.14"
ratex-katex-fonts = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-parser = "=0.1.14"
# Glyphs as outlines from the KaTeX fonts compiled in; text those fonts
# haven't (CJK, Cyrillic) comes from its system-font fallback (render.rs).
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"] }
ratex-types = "=0.1.14"
# ratex-katex-fonts embeds its fonts only in release builds unless this is
# on: debug and test builds would read them from the registry at run time.
rust-embed = { version = "8.11", features = ["debug-embed"] }
ttf-parser = "0.25"
unicode-segmentation = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
same-file = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[lints]
workspace = true
