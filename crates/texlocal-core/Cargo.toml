[package]
name = "texlocal-core"
description = "TeXLocal's project, compile, and SyncTeX core — no GUI dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dunce = "1"
getrandom = "0.4"
memchr = "2"
which = "8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
# zip's own `deflate` feature brings zopfli as well, which it uses only for
# levels past 9; the export writes at the default level, 6, which flate2
# writes either way. zip's `flate2` feature leaves flate2 with no backend, so
# the core names flate2, which no code uses, only to choose the one `deflate`
# would have: without its line, flate2 fails to build.
zip = { version = "2", default-features = false, features = ["chrono", "deflate-flate2", "flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
same-file = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
