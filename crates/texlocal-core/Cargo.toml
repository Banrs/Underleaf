[package]
name = "texlocal-core"
description = "TeXLocal's core: projects, sessions, compiling, SyncTeX and the live preview over texlocal-latex — no GUI dependencies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2"
notify = "8"
regex = "1.12.1"
schemars = { version = "1.2", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
tempfile = "3"
texlocal-latex = { path = "../texlocal-latex" }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
