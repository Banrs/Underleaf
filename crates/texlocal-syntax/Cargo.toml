[package]
name = "texlocal-syntax"
description = "LaTeX editing logic for the editors: highlighting, completion, typing and the editing commands"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "texlocal_syntax"

[dependencies]
regex = "1.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
