[package]
name = "texlocal-syntax"
description = "LaTeX editing logic for the editors: highlighting, completion, typing, the editing commands, themes and maths as SVG"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "texlocal_syntax"

[dependencies]
ratex-font = "=0.1.14"
ratex-katex-fonts = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-parser = "=0.1.14"
# Glyphs as outlines from the KaTeX fonts compiled in. Its system-font
# fallback comes with it but is never reached (render.rs).
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"] }
ratex-types = "=0.1.14"
regex = "1.12.1"
# ratex-katex-fonts embeds its fonts only in release builds unless this is
# on: debug and test builds would read them from the registry at run time.
rust-embed = { version = "8.11", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"
unicode-segmentation = "1"
