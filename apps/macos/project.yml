# The macOS app. Generate TeXLocal.xcodeproj with `xcodegen` from this folder;
# the generated project is committed too, so building needs only Xcode.
name: TeXLocal
options:
  bundleIdPrefix: com.texlocal
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
targets:
  TeXLocal:
    type: application
    platform: macOS
    sources:
      - path: TeXLocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.texlocal.mac
        PRODUCT_NAME: TeXLocal
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TeXLocal
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Deleting moves to the Trash through Finder (the trash crate's default),
        # which keeps Put Back working and needs the Automation permission.
        INFOPLIST_KEY_NSAppleEventsUsageDescription: TeXLocal asks Finder to move deleted files to the Trash, so you can put them back.
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        # The app runs latexmk and reads ~/TeXLocal, which the sandbox forbids.
        ENABLE_APP_SANDBOX: NO
        # The build scripts run cargo and npm in the repository.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../../crates/texlocal-ffi/include
      # The core's archive by path rather than -ltexlocal_ffi: the crate's
      # cdylib sits beside it, ld64 prefers a dylib, and the app would then
      # load the core from target/ on the machine that built it.
      configs:
        Debug:
          OTHER_LDFLAGS: $(SRCROOT)/../../target/debug/libtexlocal_ffi.a -liconv
        Release:
          OTHER_LDFLAGS: $(SRCROOT)/../../target/release/libtexlocal_ffi.a -liconv
    preBuildScripts:
      - name: Build Rust core
        path: scripts/build-core.sh
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Copy editor page
        path: scripts/copy-web.sh
        basedOnDependencyAnalysis: false
  TeXLocalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TeXLocalTests
    dependencies:
      - target: TeXLocal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TeXLocal.app/Contents/MacOS/TeXLocal
        BUNDLE_LOADER: $(TEST_HOST)
        # @testable import TeXLocal loads the core's module too.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../../crates/texlocal-ffi/include
schemes:
  TeXLocal:
    build:
      targets:
        TeXLocal: all
        TeXLocalTests: [test]
    test:
      targets: [TeXLocalTests]
      environmentVariables:
        TEXLOCAL_DATA: /tmp/texlocal-xctest
      # The tests run inside TeXLocal.app, which would need Documents access
      # to read the repository; the one web file they check is copied out.
      preActions:
        - name: Copy workspace.js for the tests
          settingsTarget: TeXLocal
          script: |
            mkdir -p /tmp/texlocal-xctest && cp "$SRCROOT/../../web/src/workspace.js" /tmp/texlocal-xctest/workspace.js
    run:
      config: Debug
