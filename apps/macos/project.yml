# The macOS app. Generate TeXLocal.xcodeproj with `xcodegen` from this folder;
# the generated project is committed too, so building needs only Xcode.
name: TeXLocal
options:
  bundleIdPrefix: com.texlocal
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  projectFormat: xcode16_0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
    TEXLOCAL_APP_IDENTIFIER: com.texlocal.mac
targets:
  TeXLocal:
    type: application
    platform: macOS
    sources:
      - path: TeXLocal
        type: syncedFolder
    # What Finder's Open With and the Dock icon can hand the app, as Open…
    # takes them: a .tex file, a .zip or a folder. Alternate, so TeXLocal
    # never becomes their default app; org.tug.tex is TeX distributions'
    # own type, imported for Macs without one.
    info:
      path: TeXLocal/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: LaTeX Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.tug.tex]
          - CFBundleTypeName: ZIP Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.tug.tex
            UTTypeDescription: LaTeX Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [tex]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TEXLOCAL_APP_IDENTIFIER)
        PRODUCT_NAME: TeXLocal
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TeXLocal
        # Assets.xcassets, from assets/TeXLocal.png.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Deleting moves to the Trash through Finder (the trash crate's default),
        # which keeps Put Back working and needs the Automation permission.
        INFOPLIST_KEY_NSAppleEventsUsageDescription: TeXLocal asks Finder to move deleted files to the Trash, so you can put them back.
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        # The app runs latexmk and reads ~/TeXLocal, which the sandbox forbids.
        ENABLE_APP_SANDBOX: NO
        # The build scripts run cargo and npm in the repository.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../../crates/texlocal-ffi/include
        # As Xcode 27's App template sets them: a UI module runs on the main
        # actor unless it says otherwise (WWDC25 268, 270).
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      # The core's archive by path rather than -ltexlocal_ffi: the crate's
      # cdylib sits beside it, ld64 prefers a dylib, and the app would then
      # load the core from target/ on the machine that built it.
      configs:
        Debug:
          OTHER_LDFLAGS: $(SRCROOT)/../../target/debug/libtexlocal_ffi.a -liconv
        Release:
          OTHER_LDFLAGS: $(SRCROOT)/../../target/release/libtexlocal_ffi.a -liconv
    preBuildScripts:
      - name: Build Rust core
        script: |
          "$SRCROOT/scripts/build-core.sh"
        # Cargo checks Rust inputs and the archive's freshness itself.
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Copy shared resources
        script: |
          "$SRCROOT/scripts/copy-resources.sh"
        # KaTeX's font set can change with npm packages; the script runs each
        # build but leaves unchanged bundle files untouched.
        basedOnDependencyAnalysis: false
  TeXLocalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TeXLocalTests
        type: syncedFolder
    dependencies:
      - target: TeXLocal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TeXLocal.app/Contents/MacOS/TeXLocal
        BUNDLE_LOADER: $(TEST_HOST)
        # @testable import TeXLocal loads the core's module too.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../../crates/texlocal-ffi/include
  TeXLocalUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: TeXLocalUITests
        type: syncedFolder
    dependencies:
      - target: TeXLocal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        TEST_TARGET_NAME: TeXLocal
schemes:
  TeXLocal:
    build:
      targets:
        TeXLocal: all
        TeXLocalTests: [test]
        TeXLocalUITests: [test]
    test:
      targets: [TeXLocalTests, TeXLocalUITests]
      # A scratch library: the tests make and remove projects in it.
      environmentVariables:
        TEXLOCAL_DATA: /tmp/texlocal-xctest
        UNDERLEAF_UI_TESTS: $(UNDERLEAF_UI_TESTS)
    run:
      config: Debug
