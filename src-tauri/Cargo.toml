[package]
name = "texlocal"
description = "TeXLocal — fully offline LaTeX editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "texlocal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["devtools", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
texlocal-core = { path = "../crates/texlocal-core" }
tokio = { version = "1", features = ["rt", "sync", "time"] }

# The system accent colour, read through each platform's own API — see
# src/accent.rs. Both crates are already in the tree via tauri, so declaring
# them here costs a feature, not a dependency.
[target.'cfg(target_os = "macos")'.dependencies]
# default-features = false matters: the default set is every AppKit binding,
# which drags in Core Video, Core Data and CloudKit for one colour read.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSColor",
    "NSColorSpace",
    "objc2-core-foundation",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["UI_ViewManagement"] }
