# XcodeGen spec — `xcodegen generate` produces Underleaf.xcodeproj.
# Paths are relative to this file (mac/).
#
# The app runs unsandboxed so it can spawn latexmk/synctex and read ~/TeXLocal.
# For distribution add hardened runtime + notarization; for the App Store add
# the sandbox + a security-scoped bookmark to the TeX install.
name: Underleaf
options:
  bundleIdPrefix: com.texlocal
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.texlocal.underleaf
    MARKETING_VERSION: "0.1.0"
    INFOPLIST_KEY_NSHumanReadableCopyright: "© Underleaf contributors. MIT license."
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
    INFOPLIST_KEY_CFBundleIconFile: "TeXLocal"
targets:
  Underleaf:
    type: application
    platform: macOS
    sources:
      - Underleaf
    # web/ is bundled as a folder reference → Resources/web, served by SchemeHandler.
    # Run `npm run build` (from repo root) first so web/dist exists.
    resources:
      - path: ../web
        type: folder
        buildPhase: resources
      - path: ../assets/TeXLocal.icns
        buildPhase: resources
